<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>iPad Web Teleprompter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    html, body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Floating Controls */
    #controls {
      position: fixed;
      top: env(safe-area-inset-top, 12px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(25, 25, 25, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid #333;
      padding: 10px 16px;
      border-radius: 16px;
      display: none;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      transition: opacity 0.3s ease;
      max-width: 95vw;
    }

    #controls.hidden { opacity: 0.2; }
    #controls:hover, #controls:active { opacity: 1; }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 11px;
      color: #aaa;
      text-align: center;
    }

    .button-group { display: flex; gap: 6px; }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      touch-action: manipulation;
    }
    button:active { opacity: 0.8; transform: scale(0.98); }
    button.active { background: #059669; }
    button.secondary { background: #374151; }

    input[type="range"] {
      cursor: pointer;
      accent-color: #2563eb;
      height: 28px;
    }

    /* Editor View */
    #editor-view {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 12px) 16px env(safe-area-inset-bottom, 12px) 16px;
      gap: 12px;
      z-index: 10;
      background: #0d0d0d;
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .editor-title { font-size: 18px; font-weight: 700; color: #f3f4f6; }

    .editor-container {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
    }

    textarea {
      width: 100%;
      height: 100%;
      background: #18181b;
      color: #f4f4f5;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      padding: 20px;
      font-size: 18px;
      line-height: 1.6;
      resize: none;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Prompter Window (Safari Scroll Fix) */
    #prompter-wrapper {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      z-index: 1;
    }

    #prompter-content {
      padding: 40vh 8vw;
      width: 100%;
      min-height: 100%;
    }

    /* Inversion Transforms */
    .flip-h { transform: scaleX(-1); }
    .flip-v { transform: scaleY(-1); }
    .flip-hv { transform: scale(-1, -1); }

    #script-text {
      text-align: center;
      line-height: 1.5;
      font-weight: 600;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* Cue Line */
    #cue-marker {
      display: none;
      position: fixed;
      top: 50%; left: 0;
      width: 100%; height: 2px;
      background: rgba(239, 68, 68, 0.4);
      pointer-events: none;
      z-index: 500;
    }
  </style>
</head>
<body>

  <!-- Controls Panel -->
  <div id="controls">
    <button id="toggle-btn" onclick="togglePrompter()">Edit Script</button>
    <button id="play-pause-btn" class="active" onclick="togglePlayPause()">Pause</button>
    
    <div class="button-group">
      <button class="secondary" onclick="jumpScroll(-250)">⏮ Back</button>
      <button class="secondary" onclick="jumpScroll(250)">Next ⏭</button>
    </div>

    <button id="dir-btn" class="secondary" onclick="toggleDirection()">Dir: Down</button>

    <div class="control-group">
      <label>Speed (<span id="speed-val">3</span>)</label>
      <input type="range" id="speed" min="1" max="10" value="3" oninput="updateSpeed(this.value)">
    </div>

    <div class="control-group">
      <label>Font (<span id="font-val">48</span>px)</label>
      <input type="range" id="fontSize" min="20" max="120" value="48" oninput="updateFontSize(this.value)">
    </div>

    <button id="flip-h-btn" onclick="toggleFlip('h')">Flip L-R</button>
    <button id="flip-v-btn" onclick="toggleFlip('v')">Flip U-D</button>
  </div>

  <div id="cue-marker"></div>

  <!-- Script Input View -->
  <div id="editor-view">
    <div class="editor-header">
      <div class="editor-title">Teleprompter Script Editor</div>
      <button onclick="togglePrompter()" style="background: #16a34a; font-size: 16px; padding: 12px 24px;">▶ Launch Prompter</button>
    </div>
    
    <div class="editor-container">
      <textarea id="script-input" placeholder="Paste or type your script here..."></textarea>
    </div>
  </div>

  <!-- Prompter View -->
  <div id="prompter-wrapper">
    <div id="prompter-content">
      <div id="script-text"></div>
    </div>
  </div>

  <script>
    let isRunning = false;
    let isPlaying = false;
    let flipH = false;
    let flipV = false;
    let isReverse = false;
    let scrollSpeed = 3;
    let fontSize = 48;
    let animFrame = null;

    const editorView = document.getElementById('editor-view');
    const prompterWrapper = document.getElementById('prompter-wrapper');
    const prompterContent = document.getElementById('prompter-content');
    const scriptInput = document.getElementById('script-input');
    const scriptText = document.getElementById('script-text');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const flipHBtn = document.getElementById('flip-h-btn');
    const flipVBtn = document.getElementById('flip-v-btn');
    const dirBtn = document.getElementById('dir-btn');
    const controls = document.getElementById('controls');
    const cueMarker = document.getElementById('cue-marker');

    function updateSpeed(val) {
      scrollSpeed = parseInt(val);
      document.getElementById('speed-val').innerText = val;
    }

    function updateFontSize(val) {
      fontSize = val;
      document.getElementById('font-val').innerText = val;
      scriptText.style.fontSize = val + 'px';
    }

    function jumpScroll(amount) {
      const distance = flipV ? -amount : amount;
      prompterWrapper.scrollTop += distance;
    }

    function toggleDirection() {
      isReverse = !isReverse;
      dirBtn.innerText = isReverse ? "Dir: Up" : "Dir: Down";
    }

    function toggleFlip(type) {
      if (type === 'h') flipH = !flipH;
      if (type === 'v') flipV = !flipV;

      flipHBtn.classList.toggle('active', flipH);
      flipVBtn.classList.toggle('active', flipV);

      prompterContent.className = '';
      if (flipH && flipV) prompterContent.classList.add('flip-hv');
      else if (flipH) prompterContent.classList.add('flip-h');
      else if (flipV) prompterContent.classList.add('flip-v');
    }

    function togglePrompter() {
      isRunning = !isRunning;
      if (isRunning) {
        // Unfocus text areas
        scriptInput.blur();
        if (document.activeElement) document.activeElement.blur();

        // Load content
        scriptText.innerText = scriptInput.value || "Please paste a script first...";
        scriptText.style.fontSize = fontSize + 'px';

        // Switch display state
        editorView.style.display = 'none';
        prompterWrapper.style.display = 'block';
        cueMarker.style.display = 'block';
        controls.style.display = 'flex';
        controls.classList.add('hidden');
        
        // Reset scroll position directly on wrapper
        prompterWrapper.scrollTop = 0;
        play();
      } else {
        pause();
        editorView.style.display = 'flex';
        prompterWrapper.style.display = 'none';
        cueMarker.style.display = 'none';
        controls.style.display = 'none';
        controls.classList.remove('hidden');
      }
    }

    // High performance RAF Loop for Safari iOS
    function scrollStep() {
      if (!isPlaying) return;

      let delta = scrollSpeed * 0.5;
      if (isReverse) delta = -delta;
      if (flipV) delta = -delta;

      prompterWrapper.scrollTop += delta;
      animFrame = requestAnimationFrame(scrollStep);
    }

    function play() {
      if (isPlaying) return;
      isPlaying = true;
      playPauseBtn.innerText = "Pause";
      playPauseBtn.classList.add('active');
      animFrame = requestAnimationFrame(scrollStep);
    }

    function pause() {
      isPlaying = false;
      playPauseBtn.innerText = "Play";
      playPauseBtn.classList.remove('active');
      if (animFrame) cancelAnimationFrame(animFrame);
    }

    function togglePlayPause() {
      if (!isRunning) return;
      if (isPlaying) pause();
      else play();
    }

    // Tap Anywhere on Screen to Play/Pause
    prompterWrapper.addEventListener('click', (e) => {
      if (e.target.closest('#controls')) return;
      togglePlayPause();
    });

    // Bluetooth Remote Keys
    document.addEventListener('keydown', (e) => {
      if (!isRunning) return;

      switch(e.key) {
        case ' ':
        case 'MediaPlayPause':
        case 'Enter':
          e.preventDefault();
          togglePlayPause();
          break;
        case 'ArrowRight':
        case 'PageDown':
          e.preventDefault();
          jumpScroll(250);
          break;
        case 'ArrowLeft':
        case 'PageUp':
          e.preventDefault();
          jumpScroll(-250);
          break;
        case 'ArrowUp':
          e.preventDefault();
          updateSpeed(Math.min(10, scrollSpeed + 1));
          document.getElementById('speed').value = scrollSpeed;
          break;
        case 'ArrowDown':
          e.preventDefault();
          updateSpeed(Math.max(1, scrollSpeed - 1));
          document.getElementById('speed').value = scrollSpeed;
          break;
      }
    });
  </script>
</body>
</html>
